services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports: ["5432:5432"]

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://ecommerce:ecommerce@db:5432/ecommerce
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]

  playwright:
    image: mcr.microsoft.com/playwright/python:v1.55.0-noble
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      BASE_URL: http://app:8000
    depends_on:
      app:
        condition: service_started
    command: >-
      bash -lc "pip install -q -r requirements.txt &&
      python -m pytest -m 'smoke or api' -n 2 --alluredir=allure-results"
