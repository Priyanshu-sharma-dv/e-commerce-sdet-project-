<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ShopQA — E-Commerce Test App</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header><div class="brand">ShopQA</div><div id="userStatus">Guest</div></header>
<main>
<section class="hero"><div><p class="eyebrow">QUALITY ENGINEERING DEMO</p><h1>Shop, test, validate.</h1><p>Small e-commerce application built specifically for end-to-end SDET automation.</p></div></section>
<section class="panel login"><h2>Login</h2><div class="row"><input id="email" value="qa@example.com" aria-label="Email"><input id="password" type="password" value="Password123" aria-label="Password"><button id="loginBtn">Login</button></div><p id="loginMessage"></p></section>
<section class="panel"><div class="toolbar"><h2>Products</h2><input id="search" placeholder="Search products" aria-label="Search products"><button id="searchBtn">Search</button></div><div id="products" class="grid"></div></section>
<section class="panel"><h2>Cart</h2><div id="cart">Your cart is empty.</div><button id="checkoutBtn" disabled>Place Order</button><p id="orderMessage"></p></section>
</main>
<script src="/static/app.js"></script>
</body></html>
