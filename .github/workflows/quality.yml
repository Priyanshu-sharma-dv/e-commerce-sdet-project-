name: Quality Gate

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: ruff check .
      - run: pyright
      - run: pytest --cov=app --cov=api_clients --cov=database --cov-report=xml --junitxml=test-results.xml -n auto
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-artifacts
          path: |
            test-results.xml
            coverage.xml
            reports/
            allure-results/
